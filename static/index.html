<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CityPulse</title>
<meta name="description" content="Live weather, air quality, hazards, crime, currency and health data for any city.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #EEF2F5;
  --raised: #F8FAFB;
  --ink: #14213D;
  --muted: #5B6B7D;
  --line: #C9D3DC;
  --pulse: #E08A1E;
  --good: #2E8B57;
  --fair: #B8860B;
  --poor: #C0392B;
  --display: "Bricolage Grotesque", system-ui, sans-serif;
  --body: "Source Sans 3", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1A2E; --raised: #16233B; --ink: #E6ECF2; --muted: #93A3B5;
    --line: #2A3A55; --pulse: #F0A440; --good: #4CC38A; --fair: #E0B341; --poor: #F0705E;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 1.0625rem/1.55 var(--body);
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--pulse); outline-offset: 2px; }

.wrap { max-width: 68rem; margin: 0 auto; padding: 0 1rem; }
@media (min-width: 48rem) { .wrap { padding: 0 2rem; } }

/* top bar */
.bar { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between; padding: 1.25rem 0; }
.brand { font: 800 1.25rem/1 var(--display); letter-spacing: -0.01em; text-decoration: none; }
.brand svg { vertical-align: -3px; margin-right: .35rem; }
.bar nav a { color: var(--muted); font-size: .95rem; text-decoration: none; margin-left: 1.25rem; }
.bar nav a:hover { color: var(--ink); text-decoration: underline; }

/* search */
form.search { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1.5rem 0 0; }
.search input {
  font: inherit; color: var(--ink); background: var(--raised);
  border: 1px solid var(--line); border-radius: 6px; padding: .7rem .9rem;
}
.search input[name=city] { flex: 1 1 14rem; min-width: 0; }
.search input[name=country] { flex: 0 0 6.5rem; text-transform: uppercase; }
.search button {
  font: 600 1rem var(--body); color: var(--paper); background: var(--ink);
  border: 0; border-radius: 6px; padding: .7rem 1.3rem; cursor: pointer;
}
.search button:disabled { opacity: .6; cursor: progress; }
.hint { color: var(--muted); font-size: .9rem; margin: .5rem 0 0; }
.hint button { font: inherit; color: var(--ink); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }

/* hero */
.hero { padding: 2.5rem 0 1rem; }
.hero h1 {
  font: 800 clamp(3rem, 11vw, 7.5rem)/0.92 var(--display);
  letter-spacing: -0.035em; margin: 0; overflow-wrap: anywhere;
}
.hero .where { color: var(--muted); font-size: 1.15rem; margin: .6rem 0 0; }
.hero-top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1rem 2rem; }
.score { text-align: right; }
.score .n { font: 800 clamp(3rem, 9vw, 5.5rem)/0.9 var(--display); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.score .n small { font: 400 1.1rem var(--body); color: var(--muted); letter-spacing: 0; }
.score .g { font: 600 1.15rem var(--display); margin-top: .25rem; }
.score details { font-size: .9rem; color: var(--muted); margin-top: .35rem; }
.score summary { cursor: pointer; }
.score details p { max-width: 17rem; margin: .5rem 0 0 auto; }
@media (max-width: 40rem) { .score details p { margin-left: 0; } }
.score table { margin: .5rem 0 0 auto; border-collapse: collapse; text-align: left; }
.score td { padding: .15rem 0 .15rem 1rem; font-variant-numeric: tabular-nums; }
.score td:last-child { text-align: right; color: var(--ink); }
@media (max-width: 40rem) { .score { text-align: left; } .score table { margin-left: 0; } .score td:first-child { padding-left: 0; } }
.pulse { display: block; width: 100%; height: 96px; margin: 1.25rem 0 0; overflow: visible; }
.pulse path { fill: none; stroke: var(--pulse); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.pulse .base { stroke: var(--line); stroke-width: 1; }
.pulse { height: 80px; }
.pulse-labels { display: flex; color: var(--muted); font-size: .8rem; margin-top: .25rem; }
.pulse-labels span { flex: 1; text-align: center; transform: translateX(-5%); }
@media (max-width: 30rem) { .pulse-labels { font-size: .7rem; } }
.pulse.draw path.trace { stroke-dasharray: 2000; stroke-dashoffset: 2000; animation: draw 1.4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .pulse.draw path.trace { animation: none; stroke-dashoffset: 0; } }
.summary { font-size: 1.2rem; max-width: 40rem; margin: 1.25rem 0 0; }

/* readings */
.groups { display: grid; gap: 2.5rem; padding: 2rem 0 3rem; }
@media (min-width: 60rem) { .groups { grid-template-columns: 1.15fr 1fr 1fr; gap: 3rem; } }
.group h2 { font: 600 1.05rem/1.2 var(--display); color: var(--muted); margin: 0 0 .75rem; padding-bottom: .5rem; border-bottom: 2px solid var(--ink); }
.reading { padding: .9rem 0; border-bottom: 1px solid var(--line); }
.reading .k { color: var(--muted); font-size: .95rem; }
.reading .v { font: 600 1.9rem/1.15 var(--display); letter-spacing: -0.015em; font-variant-numeric: tabular-nums; }
.reading .v small { font: 400 1rem var(--body); color: var(--muted); letter-spacing: 0; }
.reading .d { font-size: .95rem; }
.reading.na .v { color: var(--muted); font-size: 1.1rem; font-weight: 400; font-family: var(--body); }
.chip { display: inline-block; font-size: .85rem; font-weight: 600; padding: .1rem .55rem; border-radius: 999px; border: 1.5px solid currentColor; margin-left: .35rem; vertical-align: .25rem; }
.good { color: var(--good); } .fair { color: var(--fair); } .poor { color: var(--poor); }
.reading ul { margin: .35rem 0 0; padding-left: 1.1rem; font-size: .95rem; }
.stale { color: var(--fair); font-size: .85rem; }
table.days { border-collapse: collapse; margin: .35rem 0 .5rem; font-variant-numeric: tabular-nums; }
.days th, .days td { text-align: left; padding: .3rem 1rem .3rem 0; font-size: .95rem; vertical-align: baseline; }
.days th { font-weight: 400; color: var(--muted); }
.days td:nth-child(2) { font: 600 1.15rem var(--display); white-space: nowrap; }
.days small { color: var(--muted); font: 400 .9rem var(--body); }

/* compare */
form.vs { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: 1.5rem 0 0; }
form.vs label { color: var(--muted); }
form.vs input { font: inherit; color: var(--ink); background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: .45rem .7rem; flex: 0 1 14rem; min-width: 0; }
form.vs button { font: 600 .95rem var(--body); color: var(--ink); background: none; border: 1.5px solid var(--ink); border-radius: 6px; padding: .45rem .9rem; cursor: pointer; }
.cmp-head { padding: 2.5rem 0 1rem; }
.cmp-head h1 { font: 800 clamp(2.2rem, 7vw, 4.5rem)/1 var(--display); letter-spacing: -0.03em; margin: 0; }
.cmp-head p { color: var(--muted); margin: .6rem 0 0; }
.table-scroll { overflow-x: auto; margin: 1rem 0 3rem; }
table.cmp { border-collapse: collapse; width: 100%; min-width: 34rem; font-variant-numeric: tabular-nums; }
.cmp th, .cmp td { text-align: left; padding: .8rem 1rem .8rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.cmp thead th { border-bottom: 2px solid var(--ink); font: 800 1.5rem/1.1 var(--display); letter-spacing: -0.02em; }
.cmp thead th span { display: block; font: 400 .9rem var(--body); color: var(--muted); letter-spacing: 0; }
.cmp tbody th { color: var(--muted); font-weight: 400; width: 11rem; }
.cmp td { font: 600 1.25rem var(--display); }
.cmp td small { font: 400 .85rem var(--body); color: var(--muted); }
.cmp td.best { color: var(--good); }
.cmp td.best::after { content: " best"; font: 600 .75rem var(--body); vertical-align: .2rem; }
.cmp .rank td, .cmp .rank th { border-bottom: 2px solid var(--ink); }
.cmp-errors { color: var(--poor); }

/* trip planner */
.search select, .plan select {
  font: inherit; color: var(--ink); background: var(--raised);
  border: 1px solid var(--line); border-radius: 6px; padding: .7rem .6rem;
}
.search select { flex: 0 0 8.5rem; }
.plan { padding: 3rem 0 2rem; }
.plan h1 { font: 800 clamp(2.4rem, 8vw, 5rem)/1 var(--display); letter-spacing: -0.035em; margin: 0; }
.plan h1 select { font: inherit; letter-spacing: inherit; color: var(--pulse); background: none; border: 0; border-bottom: 4px solid var(--pulse); border-radius: 0; padding: 0 .1em; cursor: pointer; }
.plan p { max-width: 40rem; color: var(--muted); font-size: 1.15rem; }
.plan .go { font: 600 1.05rem var(--body); color: var(--paper); background: var(--ink); border: 0; border-radius: 6px; padding: .8rem 1.4rem; cursor: pointer; }
.month-line { color: var(--muted); font-size: 1.15rem; margin: .6rem 0 0; }
.month-line select { font: 600 1.05rem var(--body); padding: .2rem .4rem; }
.book { margin: 2rem 0 0; padding: 1.25rem 0 .5rem; border-top: 2px solid var(--ink); }
.book h2, .section h2 { font: 600 1.35rem/1.2 var(--display); margin: 0 0 .75rem; }
.book ul { margin: 0; padding: 0; list-style: none; max-width: 48rem; }
.book li { padding: .55rem 0 .55rem 1.6rem; border-bottom: 1px solid var(--line); position: relative; }
.book li::before { content: "!"; position: absolute; left: 0; top: .5rem; width: 1.15rem; height: 1.15rem; border-radius: 50%; background: var(--fair); color: var(--paper); font: 800 .8rem/1.15rem var(--display); text-align: center; }
.book .none { color: var(--good); }
.section { padding: 2.25rem 0 0; }
.climate-stats { display: flex; flex-wrap: wrap; gap: 1.25rem 2.5rem; margin: 0 0 1.25rem; }
.climate-stats div { min-width: 7rem; }
.climate-stats .v { font: 600 2rem/1.1 var(--display); letter-spacing: -0.015em; font-variant-numeric: tabular-nums; }
.climate-stats .v small { font: 400 1rem var(--body); color: var(--muted); }
.climate-stats .k { color: var(--muted); font-size: .95rem; }
.months { display: grid; grid-template-columns: repeat(12, 1fr); gap: .3rem; align-items: end; height: 9rem; max-width: 48rem; }
.months button { all: unset; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; font-size: .75rem; color: var(--muted); }
.months .bar { width: 100%; max-width: 2.6rem; background: var(--line); border-radius: 3px 3px 0 0; }
.months .best .bar { background: color-mix(in srgb, var(--good) 55%, var(--line)); }
.months .on .bar { background: var(--pulse); }
.months .on { color: var(--ink); font-weight: 600; }
.months .t { margin: .2rem 0 .15rem; font-variant-numeric: tabular-nums; }
.months button:focus-visible .bar { outline: 3px solid var(--pulse); outline-offset: 2px; }
.chart-note { color: var(--muted); font-size: .9rem; margin: .5rem 0 0; }
.src { color: var(--muted); font-size: .8rem; }
.src a { color: inherit; }
.live-head { padding: 3rem 0 0; border-bottom: 2px solid var(--ink); }
.live-head h2 { font: 600 1.35rem/1.2 var(--display); margin: 0 0 .5rem; }
.live-head p { color: var(--muted); margin: 0 0 .75rem; }

/* destinations */
ol.dest { list-style: none; margin: 1.5rem 0 3rem; padding: 0; counter-reset: d; }
.dest li { counter-increment: d; display: grid; grid-template-columns: 2.5rem 1fr auto; gap: .25rem 1rem; padding: 1rem 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.dest li::before { content: counter(d); font: 800 1.4rem var(--display); color: var(--muted); }
.dest .name { font: 800 1.6rem/1.1 var(--display); letter-spacing: -0.02em; }
.dest .name button { all: unset; cursor: pointer; }
.dest .name button:hover { text-decoration: underline; }
.dest .name button:focus-visible { outline: 3px solid var(--pulse); outline-offset: 2px; }
.dest .name small { font: 400 1rem var(--body); color: var(--muted); letter-spacing: 0; margin-left: .35rem; }
.dest .sc { font: 800 1.8rem/1 var(--display); text-align: right; font-variant-numeric: tabular-nums; }
.dest .sc small { display: block; font: 600 .85rem var(--body); }
.dest .info { grid-column: 2 / 4; color: var(--muted); font-size: .95rem; }
.dest .warn { grid-column: 2 / 4; font-size: .95rem; }
.dest .incomplete { grid-column: 2 / 4; color: var(--fair); font-size: .9rem; }
.wait { color: var(--muted); }

/* states */
.empty { padding: 3rem 0 4rem; max-width: 36rem; }
.empty h1 { font: 800 clamp(2.5rem, 8vw, 4.5rem)/1 var(--display); letter-spacing: -0.03em; margin: 0 0 1rem; }
.error { color: var(--poor); font-weight: 600; margin: 1rem 0 0; }
.loading .hero h1 { opacity: .35; }
footer { color: var(--muted); font-size: .9rem; border-top: 1px solid var(--line); padding: 1.25rem 0 2rem; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="brand" href="/">
      <svg width="22" height="16" viewBox="0 0 22 16" aria-hidden="true"><path d="M1 9h5l2-6 4 11 2-5h7" fill="none" stroke="var(--pulse)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>CityPulse
    </a>
    <nav><a href="/docs">API docs</a><a href="https://github.com/Nasty-24/CityPulse">GitHub</a></nav>
  </header>

  <form class="search" id="search" role="search">
    <label class="sr" for="city" hidden>City</label>
    <input id="city" name="city" placeholder="Search a city, e.g. Nairobi" autocomplete="off" required aria-label="City">
    <input id="country" name="country" placeholder="Country" maxlength="2" aria-label="Country code, optional" title="Optional two-letter country code, e.g. FR">
    <select id="month" aria-label="Travel month"></select>
    <button type="submit" id="go">Plan trip</button>
  </form>
  <p class="hint">Try <button data-c="Lisbon">Lisbon</button>, <button data-c="Bangkok">Bangkok</button>, <button data-c="Mombasa">Mombasa</button> or <button data-c="Reykjavik">Reykjavik</button>.</p>

  <main id="out"></main>

  <footer>Data from Open-Meteo, WHO, UK FCDO travel advice, GDACS, World Bank, USGS, NASA EONET, UK Police, Nager.Date and ExchangeRate-API. <a href="https://github.com/Nasty-24/CityPulse/blob/main/docs/TRAVEL_DATA.md">What we check and where it comes from</a>. Scores are a guide, not advice: always read official travel advice before booking.</footer>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n, d = 1) => n == null ? "–" : Number(n).toLocaleString(undefined, { maximumFractionDigits: d });

function aqiClass(v) { return v == null ? "" : v <= 50 ? "good" : v <= 100 ? "fair" : "poor"; }

// 0..1 intensity per reading; drives the pulse line
function intensities(r) {
  const d = k => r[k] && r[k].data;
  const out = [];
  const w = d("weather"); if (w) out.push(["weather", Math.min(1, Math.abs((w.temperature_2m ?? 20) - 20) / 25 + (w.weather_code >= 61 ? .3 : 0))]);
  const a = d("air"); if (a) out.push(["air", Math.min(1, (a.us_aqi ?? 0) / 200)]);
  const q = d("quakes"); if (q) out.push(["quakes", Math.min(1, (q.max ?? 0) / 7)]);
  const s = d("disasters"); if (s) out.push(["disasters", Math.min(1, s.n / 5)]);
  const c = d("crime"); if (c && c.homicide_100k) out.push(["crime", Math.min(1, c.homicide_100k.v / 20)]);
  const v = d("vaccines"); if (v && v.dtp3) out.push(["vaccines", Math.min(1, (100 - v.dtp3.v) / 50)]);
  return out;
}

function pulseSVG(items) {
  const W = 1000, H = 96, mid = 60, n = items.length || 1, seg = W / n;
  let p = `M0 ${mid}`;
  items.forEach(([, t], i) => {
    const x = i * seg, h = 6 + t * 54;
    p += ` L${x + seg * .35} ${mid} L${x + seg * .42} ${mid - h} L${x + seg * .5} ${mid + h * .45} L${x + seg * .56} ${mid} L${x + seg} ${mid}`;
  });
  const labels = items.map(([name]) => `<span>${name}</span>`).join("");
  return `<svg class="pulse draw" viewBox="0 0 ${W} ${H - 16}" preserveAspectRatio="none" role="img" aria-label="Pulse line: taller spikes mean more notable readings">
    <path class="base" d="M0 ${mid}H${W}"/><path class="trace" d="${p}"/></svg>
    <div class="pulse-labels">${labels}</div>`;
}

function dayName(iso, i) {
  if (i === 0) return "Today";
  if (i === 1) return "Tomorrow";
  return new Date(iso + "T12:00:00").toLocaleDateString(undefined, { weekday: "long" });
}

const PART_NAMES = { air: "Air quality", crime: "Safety", weather: "Weather comfort", quakes: "Earthquakes", vaccines: "Vaccination", disasters: "Natural events" };
function gradeClass(s) { return s >= 60 ? "good" : s >= 40 ? "fair" : "poor"; }

function scoreBlock(p) {
  if (!p) return "";
  const rows = Object.entries(p.parts).map(([k, v]) => `<tr><td>${PART_NAMES[k] || k}</td><td>${v}</td></tr>`).join("");
  return `<div class="score" aria-label="Pulse score ${p.score} out of 100, ${esc(p.grade)}">
    <div class="n">${p.score}<small> /100</small></div>
    <div class="g ${gradeClass(p.score)}">${esc(p.grade)}</div>
    <details><summary>How this is scored</summary>
      <table>${rows}</table>
      <p>Each reading is scored 0 to 100, higher is better, then averaged with weights. Based on ${esc(p.based_on)}.</p>
    </details>
  </div>`;
}

function reading(k, entry, body) {
  if (!entry || entry.data == null) {
    return `<div class="reading na"><div class="k">${k}</div><div class="v">Unavailable right now</div></div>`;
  }
  const stale = entry.cache === "stale" ? ` <span class="stale">(last known)</span>` : "";
  return `<div class="reading"><div class="k">${k}${stale}</div>${body(entry.data)}</div>`;
}

function liveHTML(j) {
  const r = j.res, c = j.city;
  const w = r.weather?.data, a = r.air?.data, co = r.country?.data;
  const bits = [];
  if (w) bits.push(`${esc(w.weather || "").toLowerCase()} at ${fmt(w.temperature_2m)}°C`);
  if (a) bits.push(`air quality is ${esc((a.aqi_category || "").toLowerCase())}`);
  const q = r.quakes?.data; if (q) bits.push(q.n ? `${q.n} earthquake${q.n > 1 ? "s" : ""} nearby this month` : "no earthquakes nearby this month");
  const summary = bits.length ? bits.join(", ").replace(/^./, s => s.toUpperCase()) + "." : "";

  const now = [
    reading("Weather", r.weather, d => `<div class="v">${fmt(d.temperature_2m)}<small> °C</small></div><div class="d">${esc(d.weather)}, wind ${fmt(d.wind_speed_10m)} km/h</div>`),
    reading("Air quality", r.air, d => `<div class="v">${fmt(d.us_aqi, 0)}<small> AQI</small><span class="chip ${aqiClass(d.us_aqi)}">${esc(d.aqi_category)}</span></div><div class="d">PM2.5 ${fmt(d.pm2_5)} µg/m³</div>`),
    reading("Next 3 days", r.forecast, d => `<table class="days">${d.days.map((x, i) => `<tr><th>${dayName(x.date, i)}</th><td>${fmt(x.high, 0)}° <small>/ ${fmt(x.low, 0)}°</small></td><td>${esc(x.weather)}${x.rain_chance != null ? `<small>, ${x.rain_chance}% rain</small>` : ""}</td></tr>`).join("")}</table>
      <div class="d">Sunrise ${esc(d.sunrise)}, sunset ${esc(d.sunset)} local time</div>`),
  ];
  const ground = [
    reading("Earthquakes within 300 km, last 30 days", r.quakes, d => `<div class="v">${d.n}</div><div class="d">${d.n ? `Strongest magnitude ${fmt(d.max)}` : "None at magnitude 2.5 or above"}</div>`),
    reading("Active natural events nearby", r.disasters, d => `<div class="v">${d.n}</div>${d.items.length ? `<ul>${d.items.map(x => `<li>${esc(x.t)} <span class="k">(${esc(x.cat)})</span></li>`).join("")}</ul>` : `<div class="d">Nothing reported by NASA EONET</div>`}`),
  ];
  const people = [
    reading("Homicide rate, national", r.crime, d => d.homicide_100k
      ? `<div class="v">${fmt(d.homicide_100k.v)}<small> per 100k</small></div><div class="d">${esc(d.homicide_100k.yr)} figure${d.local ? `. ${d.local.total} street-level reports nearby last month` : ""}</div>`
      : `<div class="v">–</div><div class="d">No recent figure published</div>`),
    reading("Currency", r.fx, d => d.per_usd != null
      ? `<div class="v">${fmt(d.per_usd, 2)}<small> ${esc(d.cur)} per USD</small></div><div class="d">Rate from ${esc(d.date || "today")}</div>`
      : `<div class="v">${esc(d.cur)}</div><div class="d">No exchange rate available</div>`),
    reading("Childhood vaccination", r.vaccines, d => `<div class="v">${fmt(d.dtp3?.v, 0)}<small>% DTP3</small></div><div class="d">Measles first dose ${fmt(d.mcv1?.v, 0)}% (${esc(d.dtp3?.yr ?? "")})</div>`),
  ];

  return `
    <div class="live-head">
      <h2>${esc(c.name)} right now</h2>
      <p>${c.local_time ? `Local time ${esc(c.local_time.slice(11))}. ` : ""}Live conditions for travellers already booked.${j.pulse ? ` Pulse score today: ${j.pulse.score}/100, ${esc(j.pulse.grade.toLowerCase())}.` : ""}</p>
    </div>
    ${pulseSVG(intensities(r))}
    <p class="summary">${summary}</p>
    <section class="groups">
      <div class="group"><h2>Weather and air</h2>${now.join("")}</div>
      <div class="group"><h2>Ground and hazards</h2>${ground.join("")}</div>
      <div class="group"><h2>People and money</h2>${people.join("")}</div>
    </section>
    <form class="vs" id="vs">
      <label for="vs-city">Compare ${esc(c.name)} with</label>
      <input id="vs-city" placeholder="Another city, e.g. Kampala" required>
      <button type="submit">Compare</button>
    </form>`;
}

function wireCompare() {
  const here = $("#country").value.trim();
  $("#vs")?.addEventListener("submit", e => {
    e.preventDefault();
    const other = $("#vs-city").value.trim();
    go({ compare: [here ? `${$("#city").value.trim()},${here}` : $("#city").value.trim(), other] });
  });
}

/* ---------------- trip planner ---------------- */

const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const nextMonth = () => (new Date().getMonth() + 1) % 12 + 1;
const monthOptions = sel => MONTHS.map((m, i) => `<option value="${i + 1}"${i + 1 === sel ? " selected" : ""}>${m}</option>`).join("");
const TRIP_PARTS = { climate: "Weather that month", safety: "Safety", health: "Health", hazards: "Natural hazards" };

function tripScoreBlock(t) {
  if (!t) return "";
  const rows = Object.entries(t.parts).map(([k, v]) => `<tr><td>${TRIP_PARTS[k] || k}</td><td>${v}</td></tr>`).join("");
  return `<div class="score" aria-label="Trip score ${t.score} out of 100, ${esc(t.grade)}">
    <div class="n">${t.score}<small> /100</small></div>
    <div class="g ${t.score >= 65 ? "good" : t.score >= 50 ? "fair" : "poor"}">${esc(t.grade)}</div>
    <details><summary>How this is scored</summary>
      <table>${rows}</table>
      <p>Weather 40%, safety 30%, health 18%, hazards 12%. Official "avoid all travel" warnings and poor weather cap the score: a month with poor weather is at best "Go with care". Based on ${esc(t.based_on)}.</p>
    </details>
  </div>`;
}

const val = (f, d = 1, unit = "") => f && f.v != null ? `${fmt(f.v, d)}${unit}` : "–";
const yr = f => f && f.yr ? ` (${esc(f.yr)})` : "";
const src = f => f && f.source ? `<div class="src">${esc(f.source)}</div>` : "";

function item(k, v, d, source) {
  return `<div class="reading"><div class="k">${k}</div><div class="v">${v}</div>${d ? `<div class="d">${d}</div>` : ""}${source || ""}</div>`;
}

function monthChart(byMonth, month, best) {
  if (!byMonth) return "";
  const bestSet = new Set(best.map(b => b.month));
  // scale bars to this city's own range so the good and bad months stand apart
  const scores = byMonth.map(n => n.score).filter(s => s != null);
  const lo = Math.min(...scores) - 10, hi = Math.max(...scores);
  const height = s => s == null ? 4 : Math.max(6, (s - lo) / Math.max(1, hi - lo) * 100);
  return `<div class="months" role="group" aria-label="Weather score by month. Choose a month to plan for it.">${byMonth.map(n => `
    <button type="button" data-m="${n.month}" class="${n.month === month ? "on" : ""} ${bestSet.has(n.month) ? "best" : ""}"
      aria-label="${MONTHS[n.month - 1]}: weather score ${n.score ?? "unknown"}, average high ${fmt(n.avg_high, 0)} degrees, ${fmt(n.rainy_days, 0)} rainy days${bestSet.has(n.month) ? ", one of the best months" : ""}"
      aria-pressed="${n.month === month}">
      <span class="t">${fmt(n.avg_high, 0)}°</span>
      <span class="bar" style="height:${height(n.score)}%"></span>
      <span>${MONTHS[n.month - 1].slice(0, 3)}</span>
    </button>`).join("")}</div>
    <p class="chart-note">Taller bars mean better holiday weather that month, compared with the rest of this city's year. Numbers are the average afternoon high. Green bars are the best months. Choose a bar to switch month.</p>`;
}

function renderTrip(t) {
  const c = t.city, cl = t.climate, s = t.safety || {}, h = t.health || {}, hz = t.hazards, money = t.costs || {}, pr = t.practical || {};
  const adv = s.advisory;
  const out = h.outbreaks;
  const cautions = t.cautions.length
    ? `<ul>${t.cautions.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`
    : `<p class="none">Nothing flagged for ${esc(t.month_name)}. Still read the official travel advice before you book.</p>`;
  const best = t.best_months.map(b => b.name).join(", ");

  const safety = [
    adv ? item("UK government travel advice", esc(adv.label), adv.latest_change ? esc(adv.latest_change) : "",
      `<div class="src">${esc(adv.source)}${adv.url ? `, <a href="${esc(adv.url)}" target="_blank" rel="noopener">read the full advice</a>` : ""}${adv.updated ? `, updated ${esc(adv.updated)}` : ""}</div>`) : "",
    item("Homicides per 100,000 people", val(s.homicide_100k), `National figure${yr(s.homicide_100k)}`, src(s.homicide_100k)),
    item("Road deaths per 100,000 people", val(s.road_deaths_100k), `${yr(s.road_deaths_100k)}`, src(s.road_deaths_100k)),
    item("Political stability", val(s.political_stability, 2), `From about −2.5 (unstable) to +2.5 (stable)${yr(s.political_stability)}`, src(s.political_stability)),
  ];
  const health = [
    item("Disease outbreaks, last 12 months", out ? out.country.length : "–",
      out && out.country.length ? `<ul>${out.country.map(o => `<li><a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.title)}</a> <span class="k">${esc(o.date)}</span></li>`).join("")}</ul>` : "No WHO outbreak reports name this country",
      out ? `<div class="src">${esc(out.source)}</div>` : ""),
    out && out.worldwide.length ? item("Worldwide health alerts", out.worldwide.length, `<ul>${out.worldwide.map(o => `<li><a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.title)}</a> <span class="k">${esc(o.date)}</span></li>`).join("")}</ul>`, `<div class="src">${esc(out.source)}</div>`) : "",
    item("Malaria cases per 1,000 at risk", val(h.malaria_per_1000), h.malaria_per_1000?.v ? "Ask a travel clinic about prevention" : "No local transmission reported", src(h.malaria_per_1000)),
    item("Basic drinking water", val(h.basic_water_pct, 0, "%"), "Share of people with basic access", src(h.basic_water_pct)),
    item("Doctors per 1,000 people", val(h.physicians_per_1000), "", src(h.physicians_per_1000)),
  ];
  const hazards = hz ? [
    item("Disaster alerts, last 90 days", hz.events.length,
      hz.events.length ? `<ul>${hz.events.slice(0, 6).map(e => `<li><span class="${e.alert === "Red" ? "poor" : e.alert === "Orange" ? "fair" : "good"}">${esc(e.alert)}</span> ${esc(e.type.toLowerCase())}: ${esc(e.name)} <span class="k">since ${esc(e.from)}</span></li>`).join("")}</ul>` : "No alerts for this country",
      `<div class="src">${esc(hz.source)}</div>`),
  ] : [item("Disaster alerts", "–", "Unavailable right now")];
  const practical = [
    item("Price level for visitors", money.price_level ? esc(money.price_level.label) : "–", money.price_level ? `${fmt(money.price_level.v, 2)} times US prices${yr(money.price_level)}` : "", src(money.price_level)),
    item("International visitors a year", val(money.tourist_arrivals, 0), `${yr(money.tourist_arrivals)}`, src(money.tourist_arrivals)),
    item(`Public holidays in ${esc(t.month_name)}`, pr.holidays_in_month ? pr.holidays_in_month.length : "–",
      pr.holidays_in_month?.length ? `<ul>${pr.holidays_in_month.map(x => `<li>${esc(x.name)} <span class="k">${esc(x.date)}</span></li>`).join("")}</ul>` : pr.holidays_in_month ? "None" : "Not available for this country",
      `<div class="src">${esc(pr.holidays_source)}</div>`),
    item("Languages", pr.languages?.length ? esc(pr.languages.join(", ")) : "–", "", `<div class="src">Unicode CLDR</div>`),
    item("Elevation", c.elevation != null ? `${fmt(c.elevation, 0)}<small> m</small>` : "–", c.elevation >= 2500 ? "High altitude: allow time to acclimatise" : "", ""),
  ];

  return `
    <section class="hero">
      <div class="hero-top">
        <div>
          <h1>${esc(c.name)}</h1>
          <p class="where">${esc(c.country)}${c.population ? `. ${fmt(c.population, 0)} people` : ""}</p>
          <p class="month-line"><label for="trip-month">Travelling in</label> <select id="trip-month">${monthOptions(t.month)}</select></p>
        </div>
        ${tripScoreBlock(t.trip)}
      </div>
      ${best ? `<p class="summary">Best weather for a holiday: ${esc(best)}.</p>` : ""}
    </section>
    <section class="book"><h2>Before you book</h2>${cautions}</section>
    <section class="section">
      <h2>${esc(t.month_name)} in ${esc(c.name)}</h2>
      ${cl ? `<div class="climate-stats">
        <div><div class="v">${fmt(cl.avg_high, 0)}°<small> / ${fmt(cl.avg_low, 0)}°</small></div><div class="k">Average high and low</div></div>
        <div><div class="v">${fmt(cl.rainy_days, 0)}<small> days</small></div><div class="k">With rain, ${fmt(cl.rain_mm, 0)} mm in total</div></div>
        <div><div class="v">${fmt(cl.sunshine_hours, 1)}<small> h</small></div><div class="k">Sunshine a day</div></div>
        <div><div class="v">${fmt(cl.humidity, 0)}<small>%</small></div><div class="k">Humidity</div></div>
        <div><div class="v">${fmt(cl.daylight_hours, 1)}<small> h</small></div><div class="k">Daylight</div></div>
      </div>
      ${monthChart(t.climate_by_month, t.month, t.best_months)}
      <div class="src">${esc(cl.source)}, averages for ${esc(cl.years)}</div>` : `<p class="error">Climate data is unavailable right now. Try again in a minute.</p>`}
    </section>
    <section class="groups">
      <div class="group"><h2>Safety</h2>${safety.join("")}</div>
      <div class="group"><h2>Health</h2>${health.join("")}</div>
      <div class="group"><h2>Hazards, money and practical</h2>${hazards.join("")}${practical.join("")}</div>
    </section>
    <div id="live"><p class="wait">Loading live conditions…</p></div>`;
}

function renderDestinations(j) {
  const list = j.destinations.map(d => {
    const t = d.trip, c = d.climate;
    return `<li>
      <div class="name"><button type="button" data-city="${esc(d.name)}" data-cc="${esc(d.country_code)}">${esc(d.name)}</button><small>${esc(d.country)}</small></div>
      <div class="sc ${t.score >= 65 ? "good" : t.score >= 50 ? "fair" : "poor"}">${t.score}<small>${esc(t.grade)}</small></div>
      <div class="info">${c.avg_high != null ? `${fmt(c.avg_high, 0)}° highs, ${fmt(c.rainy_days, 0)} rainy days, ${fmt(c.sunshine_hours, 0)} h sun a day. ` : ""}${d.price_level ? `${esc(d.price_level)}. ` : ""}Best months: ${esc(d.best_months.join(", ") || "unknown")}.</div>
      ${d.top_caution ? `<div class="warn">${esc(d.top_caution)}</div>` : ""}
      ${d.complete ? "" : `<div class="incomplete">Weather data missing, so this ranks below complete results.</div>`}
    </li>`;
  }).join("");
  $("#out").innerHTML = `
    <section class="plan">
      <h1>Where to go in <select id="dest-month" aria-label="Month">${monthOptions(j.month)}</select></h1>
      <p>${j.destinations.length} popular destinations ranked by weather that month, safety, health and natural hazards. Choose a city for the full picture.</p>
    </section>
    <ol class="dest">${list}</ol>`;
  document.title = `Where to go in ${j.month_name} – CityPulse`;
  $("#dest-month").addEventListener("change", e => go({ where: true, month: +e.target.value }));
  document.querySelectorAll(".dest .name button").forEach(b => b.addEventListener("click", () => {
    $("#city").value = b.dataset.city; $("#country").value = b.dataset.cc;
    go({ city: b.dataset.city, cc: b.dataset.cc, month: j.month });
  }));
}

function renderHome(month) {
  $("#out").innerHTML = `
    <section class="plan">
      <h1>Where should you go in <select id="home-month" aria-label="Month">${monthOptions(month)}</select>?</h1>
      <p>CityPulse ranks holiday destinations by the weather you can expect that month, official travel warnings, crime, disease outbreaks and natural disasters, all from public sources. Or search any city above to plan a trip there.</p>
      <button class="go" id="find">Find destinations</button>
    </section>`;
  $("#find").addEventListener("click", () => go({ where: true, month: +$("#home-month").value }));
}

async function showDestinations(month) {
  $("#out").innerHTML = `<section class="plan"><h1>Where to go in ${MONTHS[month - 1]}</h1><p class="wait">Checking weather, safety and health for 30 destinations. The first search after the app starts can take a minute or two; later ones are quick.</p></section>`;
  try {
    const res = await fetch(`/destinations?month=${month}&limit=30`);
    const j = await res.json();
    if (!res.ok) throw new Error(typeof j.detail === "string" ? j.detail : "Request failed");
    renderDestinations(j);
  } catch (e) {
    $("#out").innerHTML = `<section class="empty"><p class="error">Could not rank destinations: ${esc(e.message)}. Try again in a minute.</p></section>`;
  }
}

// rows for the compare table: label, value getter, display, which direction is better
const ROWS = [
  ["Local time", (r, c) => c.local_time, v => esc(v.slice(11)), null],
  ["Population", (r, c) => c.population, v => fmt(v, 0), null],
  ["Tomorrow", r => r.forecast?.data?.days?.[1]?.high, (v, r) => `${fmt(v, 0)}° <small>${esc(r.forecast.data.days[1].weather)}, ${r.forecast.data.days[1].rain_chance ?? "–"}% rain</small>`, null],
  ["Air quality (AQI)", r => r.air?.data?.us_aqi, (v, r) => `${fmt(v, 0)} <small>${esc(r.air.data.aqi_category)}</small>`, "low"],
  ["Temperature", r => r.weather?.data?.temperature_2m, (v, r) => `${fmt(v)}°C <small>${esc(r.weather.data.weather)}</small>`, null],
  ["Strongest quake nearby, 30 days", r => r.quakes?.data ? (r.quakes.data.max ?? 0) : undefined, (v, r) => r.quakes.data.n ? `M${fmt(v)} <small>${r.quakes.data.n} quakes</small>` : "None", "low"],
  ["Active natural events", r => r.disasters?.data?.n, v => fmt(v, 0), "low"],
  ["Homicides per 100k", r => r.crime?.data?.homicide_100k?.v, (v, r) => `${fmt(v)} <small>${esc(r.crime.data.homicide_100k.yr)}</small>`, "low"],
  ["DTP3 vaccination", r => r.vaccines?.data?.dtp3?.v, v => `${fmt(v, 0)}%`, "high"],
  ["Currency per USD", r => r.fx?.data?.per_usd, (v, r) => `${fmt(v, 2)} <small>${esc(r.fx.data.cur)}</small>`, null],
];

function renderCompare(j) {
  const ok = j.cities.filter(c => c.city), bad = j.cities.filter(c => !c.city);
  if (ok.length < 2) throw new Error(bad.map(b => `${b.query}: ${b.err}`).join(". ") || "Not enough cities found to compare.");
  const top = j.ranking[0];
  const cell = (cls, html) => `<td class="${cls}">${html}</td>`;
  const scores = ok.map(c => c.pulse?.score);
  const bestScore = Math.max(...scores.filter(s => s != null));
  const body = ROWS.map(([label, get, show, dir]) => {
    const vals = ok.map(c => get(c.res, c.city));
    const known = vals.filter(v => v != null);
    const best = dir && known.length > 1 && new Set(known).size > 1 ? (dir === "low" ? Math.min(...known) : Math.max(...known)) : null;
    return `<tr><th scope="row">${label}</th>${vals.map((v, i) => v == null ? cell("", "–") : cell(v === best ? "best" : "", show(v, ok[i].res))).join("")}</tr>`;
  }).join("");
  $("#out").innerHTML = `
    <section class="cmp-head">
      <h1>${ok.map(c => esc(c.city.name)).join(" vs ")}</h1>
      <p>${top ? `${esc(top.name)} has the highest pulse score at ${top.score}.` : ""} Green marks the better value in each row.</p>
      ${bad.length ? `<p class="cmp-errors">Left out: ${bad.map(b => `${esc(b.query)} (${esc(b.err)})`).join(", ")}.</p>` : ""}
    </section>
    <div class="table-scroll"><table class="cmp">
      <thead><tr><td></td>${ok.map(c => `<th scope="col">${esc(c.city.name)}<span>${esc(c.city.country)}</span></th>`).join("")}</tr></thead>
      <tbody>
        <tr class="rank"><th scope="row">Pulse score</th>${ok.map(c => c.pulse ? cell(c.pulse.score === bestScore && ok.length > 1 ? "best" : "", `${c.pulse.score} <small>${esc(c.pulse.grade)}</small>`) : cell("", "–")).join("")}</tr>
        ${body}
      </tbody>
    </table></div>`;
  document.title = `${ok.map(c => c.city.name).join(" vs ")} – CityPulse`;
}

function go(state) {
  const u = new URL(location.pathname, location.origin);
  if (state.compare) state.compare.forEach(c => u.searchParams.append("compare", c));
  else if (state.where) { u.searchParams.set("where", "1"); u.searchParams.set("month", state.month); }
  else {
    u.searchParams.set("city", state.city);
    if (state.cc) u.searchParams.set("country", state.cc);
    if (state.month) u.searchParams.set("month", state.month);
  }
  history.pushState(null, "", u);
  route();
  window.scrollTo(0, 0);
}

async function compareCities(list) {
  const btn = $("#go");
  btn.disabled = true;
  $("#out").innerHTML = `<section class="cmp-head"><h1>Comparing ${list.map(c => esc(c.split(",")[0])).join(" and ")}…</h1></section>`;
  try {
    const res = await fetch(`/compare?${list.map(c => "city=" + encodeURIComponent(c)).join("&")}`);
    const j = await res.json();
    if (!res.ok) throw new Error(typeof j.detail === "string" ? j.detail : "Request failed");
    renderCompare(j);
  } catch (e) {
    $("#out").innerHTML = `<section class="empty"><p class="error">${esc(e.message)}</p></section>`;
  } finally { btn.disabled = false; }
}

async function getJSON(url) {
  const res = await fetch(url);
  const j = await res.json();
  if (!res.ok) throw new Error(typeof j.detail === "string" ? j.detail : res.status === 422 ? "Country must be a two-letter code, like FR or US." : "Request failed");
  return j;
}

async function check(city, cc, month) {
  const btn = $("#go");
  btn.disabled = true; btn.textContent = "Planning…";
  $("#out").innerHTML = `<section class="hero"><h1>${esc(city)}</h1><p class="wait">Checking weather for ${MONTHS[month - 1]}, travel advice, health and hazards…</p></section>`;
  const qs = cc ? `&country=${encodeURIComponent(cc)}` : "";
  const live = getJSON(`/city/${encodeURIComponent(city)}?${qs.slice(1)}`);  // in parallel
  try {
    const t = await getJSON(`/trip/${encodeURIComponent(city)}?month=${month}${qs}`);
    $("#out").innerHTML = renderTrip(t);
    document.title = `${t.city.name} in ${t.month_name} – CityPulse`;
    $("#trip-month").addEventListener("change", e => go({ city, cc, month: +e.target.value }));
    document.querySelectorAll(".months button").forEach(b => b.addEventListener("click", () => go({ city, cc, month: +b.dataset.m })));
    live.then(j => { $("#live").innerHTML = liveHTML(j); wireCompare(); })
        .catch(() => { $("#live").innerHTML = `<p class="wait">Live conditions are unavailable right now.</p>`; });
  } catch (e) {
    const msg = /not found/i.test(e.message) ? `No city called “${esc(city)}”${cc ? ` in ${esc(cc.toUpperCase())}` : ""}. Check the spelling${cc ? " or remove the country code" : ""}.` : esc(e.message);
    $("#out").innerHTML = `<section class="empty"><p class="error">${msg}</p></section>`;
  } finally {
    btn.disabled = false; btn.textContent = "Plan trip";
  }
}

$("#month").innerHTML = monthOptions(nextMonth());
$("#search").addEventListener("submit", e => {
  e.preventDefault();
  go({ city: $("#city").value.trim(), cc: $("#country").value.trim(), month: +$("#month").value });
});
document.querySelectorAll(".hint button").forEach(b => b.addEventListener("click", () => {
  $("#city").value = b.dataset.c; $("#country").value = b.dataset.cc || "";
  go({ city: b.dataset.c, cc: b.dataset.cc || "", month: +$("#month").value });
}));

// the URL is the state: ?city=X[&country=YY][&month=M], ?where=1&month=M, or ?compare=A&compare=B
function route() {
  const p = new URLSearchParams(location.search);
  const m = +p.get("month");
  const month = m >= 1 && m <= 12 ? m : nextMonth();
  $("#month").value = month;
  const cmp = p.getAll("compare");
  if (cmp.length) return compareCities(cmp);
  if (p.get("where")) return showDestinations(month);
  if (p.get("city")) {
    $("#city").value = p.get("city"); $("#country").value = p.get("country") || "";
    return check(p.get("city"), p.get("country") || "", month);
  }
  renderHome(month);
}
window.addEventListener("popstate", route);
route();
</script>
